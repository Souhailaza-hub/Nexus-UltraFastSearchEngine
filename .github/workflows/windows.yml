name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure
        shell: pwsh
        run: |
          $pybind11Dir = python -m pybind11 --cmakedir
          cmake -S . -B build -A x64 "-Dpybind11_DIR=$pybind11Dir" -DNEXUS_FETCH_GTEST=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run C++ tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run Python tests
        shell: pwsh
        run: |
          $extension = Get-ChildItem .\build\bindings -Recurse -Filter "_nexus*.pyd" | Select-Object -First 1
          if (-not $extension) { throw "The _nexus extension was not built." }
          $env:PYTHONPATH = $extension.DirectoryName
          python -m unittest discover -s tests\python -v
